server {
  listen 80;
  listen [::]:80;
  server_name files.choimaytau.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name files.choimaytau.com;

  ssl_certificate /etc/letsencrypt/live/files.choimaytau.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/files.choimaytau.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 64m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Public download-only route used after /d/<token> validation.
  location ^~ /_raw/d/ {
    proxy_pass http://127.0.0.1:5244/d/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location ^~ /_raw/ {
    return 404;
  }

  location ^~ /_alist/ {
    # AList is a single-page app with its own login. Nginx Basic Auth on this
    # subpath can break API/static fetches and cause repeated login prompts.
    proxy_pass http://127.0.0.1:5244/_alist/;
    proxy_http_version 1.1;
    add_header Cache-Control "no-store" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
