server {
    listen 80;
    server_name files.choimaytau.com;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Public download-only AList path used after /d/<token> validation.
    # Keep AList browse/admin UI away from this route; only /d/... should be reachable here.
    location /_raw/ {
        proxy_pass http://127.0.0.1:5244/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Optional AList admin/file browser. Add auth_basic or restrict by IP before enabling.
    location /_alist/ {
        auth_basic "AList Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-files-alist;
        proxy_pass http://127.0.0.1:5244/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
