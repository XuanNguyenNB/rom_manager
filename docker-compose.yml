services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - alist
    ports:
      - "127.0.0.1:3000:3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rom_manager
      POSTGRES_USER: rom_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  alist:
    image: xhofe/alist:latest
    restart: unless-stopped
    environment:
      - PUID=0
      - PGID=0
      - UMASK=022
    volumes:
      - alist_data:/opt/alist/data
    ports:
      - "127.0.0.1:5244:5244"

volumes:
  postgres_data:
  alist_data:
